<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b04a2f" />
    <title>Archivio 1001</title>
    <link rel="manifest" href="__DEPLOY_BASE_PATH__manifest.webmanifest" />
    <link rel="stylesheet" href="__DEPLOY_BASE_PATH__styles.css" />
  </head>
  <body>
    <nav class="top-nav-shell" aria-label="Navigazione app">
      <div id="route-nav" class="top-nav"></div>
    </nav>

    <main class="app-shell">
      <div id="dashboard-panels">
        <section class="dashboard-card search-card">
          <form id="search-form" class="search-form">
            <label class="sr-only" for="search-input">Cerca un titolo</label>
            <input
              id="search-input"
              name="query"
              type="search"
              autocomplete="off"
              placeholder="Cerca un titolo"
            />
            <button id="search-submit" type="submit">Vai alla lista</button>
          </form>
        </section>

        <section class="dashboard-card">
          <nav id="route-grid" class="route-grid" aria-label="Navigazione primaria"></nav>
        </section>

        <section class="dashboard-card">
          <div id="archive-state"></div>
        </section>
      </div>

      <div id="route-content" class="dashboard-card route-content preview-copy"></div>
    </main>

    <script type="module" src="__DEPLOY_BASE_PATH__app.js"></script>
  </body>
</html>
